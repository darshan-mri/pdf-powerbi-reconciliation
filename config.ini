# ==========================================================================
# Power BI connection (shared by every *.PBI section)
# ==========================================================================
[POWERBI]
; AuthMode: client_secret | certificate | managed_identity | key_vault | device_code
AuthMode = client_secret
TenantId = <tenant-guid>
ClientId = <app-client-id>

; --- client_secret mode -------------------------------------------------
; Leave ClientSecret EMPTY and store the real secret in this env var.
ClientSecret =
ClientSecretEnv = PBI_CLIENT_SECRET

; --- certificate mode ---------------------------------------------------
CertPath = secrets/pbi-cert.pem
CertThumbprint =

; --- key_vault mode -----------------------------------------------------
KeyVaultUrl =
KeyVaultSecretName = pbi-client-secret

; --- misc ---------------------------------------------------------------
TokenCache = .pbi_token_cache.json
RequestTimeout = 180

# ==========================================================================
# Self-healing extraction engine
# ==========================================================================
[PIPELINE]
SchemaDir = schemas
BaselineDir = schemas/baselines
QuarantineDir = files/quarantine
; Auto-repair the schema when the PDF layout drifts
AutoHeal = true
; Never apply a healed schema unless it passes the regression guard
RequireRegressionPass = true
; Healed schemas below this confidence are written but flagged for human review
HealConfidenceThreshold = 0.85
; Row-count drop (fraction) that triggers drift detection
DriftRowTolerance = 0.10


